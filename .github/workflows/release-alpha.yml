name: Release Alpha

on:
  push:
    tags: ["v*-alpha*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs once, before any build. A release must come from reviewed code: the
  # tagged commit has to be on main (merged through a PR, CI and review), and its
  # package.json version must match the tag.
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tag must point at a commit on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Merge through a PR first, then tag the merge commit." >&2
            exit 1
          fi

      - name: Tag must match package.json version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

  build:
    name: Build – ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
          - os: ubuntu-latest
            script: package:linux
          - os: macos-latest
            script: package:mac

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Run the full test suite before packaging
      - run: npm run typecheck
      - run: npm test

      # The package:* scripts pass --publish never. Without it electron-builder
      # sees the tag and tries to publish to GitHub Releases itself, with no
      # token — the "GitHub Personal Access Token is not set" failure. Publishing
      # is the release job's job, below.
      - run: npm run ${{ matrix.script }}

      # Upload installers as artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist-artifacts
          pattern: installer-*
          merge-multiple: true

      # Create GitHub Pre-Release using GitHub CLI (official GitHub tool, no third-party action)
      - name: Create Pre-Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist-artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --prerelease \
            --generate-notes
