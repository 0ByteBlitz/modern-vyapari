name: Release Alpha

on:
  push:
    tags: ["v*-alpha*"]

permissions:
  contents: write          # needed to create the GitHub Release

jobs:
  build:
    name: Build – ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Run the full test suite before packaging
      - run: npm run typecheck
      - run: npm test

      - run: npm run package:win
        if: matrix.os == 'windows-latest'

      # Build for Linux/macOS if you add those targets later
      - run: npm run build && npx electron-builder ${{ matrix.args }}
        if: matrix.os != 'windows-latest'

      # Upload installers as artifacts (available even if release step fails)
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.snap
          if-no-files-found: ignore

      # Create / append to the GitHub Release (pre-release flagged)
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb

